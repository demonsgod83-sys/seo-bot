# ============================================================
#  postgresql.conf — production-tuned overrides
#  Mounted read-only at /etc/postgresql/postgresql.conf
#
#  Sizing targets a small dedicated VM (1-2 vCPU, 1-2 GB RAM).
#  Scale the memory/connection settings for your actual host.
# ============================================================

# ---- CONNECTION ----
listen_addresses        = '*'          # Compose networking handles external access
max_connections         = 100          # Keep low; use PgBouncer if you need more

# ---- MEMORY ----
# shared_buffers: ~25% of RAM. On 1 GB host → 256 MB.
shared_buffers          = 256MB
# effective_cache_size: ~75% of RAM (planner hint, not allocated).
effective_cache_size    = 768MB
# work_mem: per sort / hash operation. 100 conns × 4 MB = 400 MB worst-case.
work_mem                = 4MB
# maintenance_work_mem: VACUUM, CREATE INDEX, etc.
maintenance_work_mem    = 64MB

# ---- WAL / DURABILITY ----
wal_level               = replica     # required for logical replication later
# fsync off is tempting but catastrophic on crash — always keep on.
fsync                   = on
synchronous_commit      = on
# Group commits for better write throughput
commit_delay            = 0
wal_buffers             = 16MB

# ---- CHECKPOINTS ----
checkpoint_completion_target = 0.9
# Don't checkpoint too often; every 5 min or 256 MB
checkpoint_timeout      = 5min
max_wal_size            = 1GB
min_wal_size            = 80MB

# ---- QUERY PLANNER ----
random_page_cost        = 1.1         # SSD — lower than the default 4.0
effective_io_concurrency = 200        # SSD concurrent I/O

# ---- LOGGING ----
log_destination         = 'stderr'    # Docker captures stderr → json-file driver
logging_collector       = off         # Docker handles rotation; don't duplicate
log_min_duration_statement = 1000     # Log queries slower than 1 s
log_line_prefix         = '%t [%p] %u@%d '
log_timezone            = 'UTC'
log_connections         = on
log_disconnections      = on
log_lock_waits          = on
deadlock_timeout        = 1s

# ---- AUTOVACUUM ----
autovacuum              = on
autovacuum_max_workers  = 3
autovacuum_naptime      = 1min
# Throttle autovacuum so it doesn't spike I/O
autovacuum_vacuum_cost_delay = 2ms

# ---- LOCALE / TIMEZONE ----
timezone                = 'UTC'
lc_messages             = 'C'
lc_monetary             = 'C'
lc_numeric              = 'C'
lc_time                 = 'C'

# ---- SECURITY ----
# Do not allow superuser login from non-local connections
ssl                     = off         # Enable + configure certs when behind TLS terminator
